name: deploy
on: push
jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v7

      - name: Install NodeJs
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      
      - name: Install dependencies
        run: npm ci 

      - name: run Lint
        run: npm run lint

  test-and-deploy:
    needs: linter
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v7

      - name: Install NodeJs
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      
      - name: Install dependencies
        run: npm ci 

      - name: run tests
        run: npm test

      - name: Build project
        run: npm run build

      - name: deplou
        run: echo "Deploying ..."
